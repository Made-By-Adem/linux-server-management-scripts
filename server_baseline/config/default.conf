#!/bin/bash
# =============================================================================
# Server Baseline Installation - Default Configuration
# =============================================================================
# This file contains all configurable values for the server baseline script.
# All values can be overridden by creating a custom profile in config/profiles/
#
# Usage:
#   ./install.sh                          # Uses this default configuration
#   ./install.sh --profile production     # Uses config/profiles/production.conf
#   ./install.sh --config custom.conf     # Uses custom configuration file
#
# =============================================================================

# =============================================================================
# SYSTEM BASICS
# =============================================================================

# Timezone configuration
# Examples: Europe/Amsterdam, America/New_York, Asia/Tokyo, UTC
SYSTEM_TIMEZONE="Europe/Amsterdam"

# Hostname FQDN suffix (added to hostname if not already fully qualified)
HOSTNAME_FQDN_SUFFIX=".local"

# =============================================================================
# PASSWORD & AUTHENTICATION
# =============================================================================

# Password Aging Configuration (Days)
# ---------------------------------------------------------------------------
# How often users must change their passwords
# Compliance recommendations:
#   - PCI-DSS:          90 days
#   - NIST 800-53:      365 days
#   - ISO 27001:        90-180 days
#   - CIS Benchmark:    365 days
#   - Development:      -1 (disabled, not recommended for production)
PASSWORD_MIN_DAYS=7              # Minimum days between password changes
PASSWORD_MAX_DAYS=365            # Maximum password age (KEY VALUE - affects user experience)
PASSWORD_WARN_DAYS=30            # Warning days before expiration

# Password Complexity Requirements
# ---------------------------------------------------------------------------
PASSWORD_MIN_LENGTH=12           # Minimum password length (8-32 recommended)
PASSWORD_MIN_CLASSES=3           # Character classes required (lower, upper, digit, special)
PASSWORD_MAX_REPEAT=3            # Maximum consecutive same characters
PASSWORD_REQUIRE_DIGIT=-1        # Require at least one digit (-1 = yes, 0 = no)
PASSWORD_REQUIRE_UPPER=-1        # Require at least one uppercase letter
PASSWORD_REQUIRE_LOWER=-1        # Require at least one lowercase letter
PASSWORD_REQUIRE_SPECIAL=-1      # Require at least one special character

# Password Hashing Configuration
# ---------------------------------------------------------------------------
# Higher rounds = slower brute-force attacks but slower login
# 65536 rounds = ~0.1s login delay on modern hardware
PASSWORD_HASH_ALGORITHM="SHA512" # Encryption method (SHA512 recommended)
PASSWORD_HASH_ROUNDS=65536       # SHA-512 hashing rounds (5000-100000)

# PAM Configuration
# ---------------------------------------------------------------------------
PAM_PWQUALITY_RETRY=3            # Password retry attempts during passwd command

# =============================================================================
# SSH CONFIGURATION
# =============================================================================

# SSH Port Configuration
# ---------------------------------------------------------------------------
# WARNING: Changing SSH port without proper setup can lock you out!
# The script keeps BOTH ports active during migration with a grace period
SSH_OLD_PORT=22                  # Standard SSH port (kept during migration)
SSH_NEW_PORT=888                 # New SSH port (customize for your environment)
SSH_PORT_MIGRATION_GRACE_HOURS=24  # Hours to keep old port 22 active (safety feature)

# SSH Security Settings
# ---------------------------------------------------------------------------
SSH_MAX_AUTH_TRIES=3             # Maximum authentication attempts per connection
SSH_CLIENT_ALIVE_INTERVAL=300    # Seconds before sending keepalive (0 = disabled)
SSH_CLIENT_ALIVE_COUNT_MAX=2     # Max keepalive attempts before disconnect
SSH_MAX_SESSIONS_DEFAULT=2       # Default concurrent sessions (will be prompted)
SSH_MAX_SESSIONS_MIN=1           # Minimum allowed sessions
SSH_MAX_SESSIONS_MAX=10          # Maximum allowed sessions
SSH_LOG_LEVEL="VERBOSE"          # SSH logging level (QUIET, FATAL, ERROR, INFO, VERBOSE, DEBUG)

# SSH Feature Toggles (will be prompted during installation)
# ---------------------------------------------------------------------------
SSH_DISABLE_IPV6=true            # Disable IPv6 for SSH (AddressFamily inet)
SSH_ALLOW_TCP_FORWARDING=true    # Allow TCP port forwarding
SSH_ALLOW_AGENT_FORWARDING=true  # Allow SSH agent forwarding

# =============================================================================
# FIREWALL (UFW)
# =============================================================================

# Default Firewall Ports
# ---------------------------------------------------------------------------
# Comma-separated list of ports to always allow
# 22    = SSH (temporary during migration)
# 888   = SSH (new port)
# 80    = HTTP
# 443   = HTTPS
UFW_DEFAULT_PORTS="22,888,80,443"

# UFW Configuration
# ---------------------------------------------------------------------------
UFW_ALLOW_IPV6=false             # Enable IPv6 in UFW
UFW_RATE_LIMIT_SSH=true          # Apply rate limiting to SSH ports

# =============================================================================
# FAIL2BAN INTRUSION PREVENTION
# =============================================================================

# Default Fail2ban Settings (applies to all jails unless overridden)
# ---------------------------------------------------------------------------
FAIL2BAN_DEFAULT_BANTIME=3600    # Ban duration in seconds (3600 = 1 hour)
FAIL2BAN_DEFAULT_FINDTIME=600    # Detection window in seconds (600 = 10 minutes)
FAIL2BAN_DEFAULT_MAXRETRY=5      # Max failed attempts before ban

# SSH-Specific Fail2ban Settings
# ---------------------------------------------------------------------------
# SSH is more critical, so use stricter settings
FAIL2BAN_SSH_MAXRETRY=3          # Max SSH login failures (stricter than default)
FAIL2BAN_SSH_BANTIME=7200        # SSH ban duration (7200 = 2 hours)
FAIL2BAN_SSH_FINDTIME=600        # SSH detection window (10 minutes)

# =============================================================================
# KERNEL HARDENING (SYSCTL)
# =============================================================================

# Network Security
# ---------------------------------------------------------------------------
SYSCTL_IP_FORWARD=1              # IP forwarding (1 = required for Docker, 0 = disabled)
SYSCTL_ACCEPT_REDIRECTS=0        # ICMP redirect protection (0 = reject)
SYSCTL_ACCEPT_SOURCE_ROUTE=0     # Source routing protection (0 = disabled)
SYSCTL_LOG_MARTIANS=1            # Log suspicious packets (1 = enabled)
SYSCTL_RP_FILTER=1               # Reverse path filtering (1 = strict mode)
SYSCTL_ICMP_ECHO_IGNORE=0        # Respond to ping (0 = respond, 1 = ignore)

# SYN Flood Protection
# ---------------------------------------------------------------------------
SYSCTL_TCP_SYNCOOKIES=1          # Enable SYN cookies (1 = enabled)
SYSCTL_TCP_MAX_SYN_BACKLOG=2048  # SYN backlog size (higher = more protection)
SYSCTL_TCP_SYNACK_RETRIES=2      # SYN-ACK retries (lower = faster timeout)
SYSCTL_TCP_SYN_RETRIES=5         # SYN retries

# Connection Tracking
# ---------------------------------------------------------------------------
# CRITICAL for QUIC protocol (HTTP/3) and high-traffic servers
# Cloudflare Tunnel requires high conntrack limits
SYSCTL_CONNTRACK_MAX=524288      # Max tracked connections (default: 65536)

# Performance Tuning
# ---------------------------------------------------------------------------
SYSCTL_VM_SWAPPINESS=10          # Swap usage preference (0-100, lower = less swap)
SYSCTL_VFS_CACHE_PRESSURE=50     # VFS cache pressure (lower = keep cache longer)

# Security Hardening
# ---------------------------------------------------------------------------
SYSCTL_KPTR_RESTRICT=2           # Hide kernel pointers (2 = always hidden)
SYSCTL_DMESG_RESTRICT=1          # Restrict dmesg access (1 = root only)
SYSCTL_PTRACE_SCOPE=1            # Restrict ptrace (1 = same UID only)
SYSCTL_BPF_JIT_HARDEN=1          # BPF JIT hardening (1 = QUIC compatible, 2 = stricter)
SYSCTL_PERF_EVENT_PARANOID=3     # Restrict performance events (3 = kernel only)
SYSCTL_UNPRIVILEGED_BPF_DISABLED=1  # Disable unprivileged BPF (1 = disabled)

# =============================================================================
# SYSTEMD & LOGGING
# =============================================================================

# Journald Configuration
# ---------------------------------------------------------------------------
JOURNAL_STORAGE="persistent"     # Storage mode (persistent, volatile, auto, none)
JOURNAL_COMPRESS=true            # Compress logs (true = enabled)
JOURNAL_MAX_USE="500M"           # Maximum total disk usage
JOURNAL_MAX_FILE_SIZE="100M"     # Maximum single file size
JOURNAL_KEEP_FREE="100M"         # Keep this much disk space free
JOURNAL_RETENTION_DAYS=30        # Log retention in days
JOURNAL_FORWARD_SYSLOG=true      # Forward to syslog (true = enabled)

# =============================================================================
# SYSTEM LIMITS
# =============================================================================

# Process & File Limits
# ---------------------------------------------------------------------------
# These limits prevent resource exhaustion attacks
SYSTEM_MAX_FILES=65535           # File descriptor limit (nofile)
SYSTEM_MAX_PROCESSES=65535       # Process limit (nproc)

# =============================================================================
# DOCKER CONFIGURATION
# =============================================================================

# Docker Logging
# ---------------------------------------------------------------------------
DOCKER_LOG_DRIVER="json-file"    # Log driver (json-file, syslog, journald, none)
DOCKER_LOG_MAX_SIZE="10M"        # Max log file size per container
DOCKER_LOG_MAX_FILES=3           # Number of log files to keep

# =============================================================================
# SWAP CONFIGURATION
# =============================================================================

# Swap File Configuration
# ---------------------------------------------------------------------------
SWAP_ENABLED=true                # Create swap file (true/false)
SWAP_SIZE_AUTO=true              # Auto-calculate based on RAM (recommended)
SWAP_SIZE_MB=2048                # Manual swap size in MB (used if auto=false)

# Swap calculation formula when auto=true:
#   RAM ≤ 2GB:    Swap = RAM × 2
#   RAM 2-8GB:    Swap = RAM
#   RAM > 8GB:    Swap = 8GB

# =============================================================================
# MONITORING & SCANNING
# =============================================================================

# Rkhunter (Rootkit Scanner)
# ---------------------------------------------------------------------------
RKHUNTER_ENABLED=true            # Enable rkhunter installation
RKHUNTER_SCAN_TIME="03:00"       # Daily scan time (HH:MM format)
RKHUNTER_SCAN_DAY="*"            # Day of month (* = daily)

# Lynis (Security Auditing)
# ---------------------------------------------------------------------------
LYNIS_ENABLED=true               # Enable Lynis installation
LYNIS_SCAN_TIME="04:00"          # Scan time (HH:MM format)
LYNIS_SCAN_DAY="1"               # Day of month (1-31, monthly)

# AIDE (File Integrity Monitoring)
# ---------------------------------------------------------------------------
# WARNING: AIDE is I/O intensive, not recommended for Raspberry Pi / SD cards
AIDE_ENABLED=false               # Enable AIDE (production servers only)
AIDE_SCAN_TIME="04:00"           # Daily scan time (HH:MM format)
AIDE_CHECKSUM="sha512"           # Checksum algorithm (sha256, sha512)

# Sysstat (Performance Monitoring)
# ---------------------------------------------------------------------------
SYSSTAT_ENABLED=true             # Enable sysstat (sar, iostat, mpstat)
SYSSTAT_HISTORY_DAYS=28          # Days to keep performance history

# Debsums (Package Integrity)
# ---------------------------------------------------------------------------
DEBSUMS_ENABLED=true             # Enable debsums package verification
DEBSUMS_CHECK_INTERVAL="weekly"  # Check interval (daily, weekly, monthly)

# =============================================================================
# SECURITY OPTIONS
# =============================================================================

# USB Storage Control
# ---------------------------------------------------------------------------
USB_STORAGE_ENABLED=false        # Allow USB mass storage (false = disabled for security)

# Core Dumps
# ---------------------------------------------------------------------------
CORE_DUMPS_ENABLED=false         # Allow core dumps (false = disabled for security)

# Legal Banners
# ---------------------------------------------------------------------------
LEGAL_BANNERS_ENABLED=false      # Display legal warning banners on login

# /proc Hardening
# ---------------------------------------------------------------------------
PROC_HIDEPID=true                # Hide other users' processes (hidepid=2)

# Compiler Restrictions
# ---------------------------------------------------------------------------
# Restrict access to compilers (gcc, g++, make) to root only
# Only enable on production servers where development is not needed
COMPILER_RESTRICT_ENABLED=false  # Restrict compiler access (production only)

# =============================================================================
# CONTAINER SERVICES
# =============================================================================

# Portainer (Docker Management UI)
# ---------------------------------------------------------------------------
PORTAINER_ENABLED=false          # Install Portainer (will be prompted)
PORTAINER_HTTPS_PORT=9443        # Portainer HTTPS web interface port
PORTAINER_AGENT_PORT=8000        # Portainer Agent port (for multi-host)
PORTAINER_AGENT_ENABLED=false    # Expose agent port

# Netdata (Real-time Monitoring)
# ---------------------------------------------------------------------------
NETDATA_ENABLED=false            # Install Netdata (will be prompted)
NETDATA_HTTP_PORT=19999          # Netdata dashboard HTTP port
NETDATA_HOSTNAME_AUTO=true       # Use system hostname automatically
NETDATA_HOSTNAME=""              # Custom hostname (if auto=false)

# Cloudflare Tunnel
# ---------------------------------------------------------------------------
CLOUDFLARE_ENABLED=false         # Install Cloudflare Tunnel (will be prompted)

# =============================================================================
# TELEGRAM NOTIFICATIONS
# =============================================================================

# Telegram Bot Configuration
# ---------------------------------------------------------------------------
# Used for security scan notifications (rkhunter, lynis)
# Leave empty to disable Telegram notifications
TELEGRAM_BOT_TOKEN=""            # Bot token from @BotFather
TELEGRAM_CHAT_ID=""              # Chat ID to send notifications

# =============================================================================
# BACKUP & ROLLBACK
# =============================================================================

# Backup Configuration
# ---------------------------------------------------------------------------
BACKUP_DIR="/var/backups/server-setup-backup"  # Backup directory base path
BACKUP_RETENTION_DAYS=30         # Keep backups for X days (automatic cleanup)
BACKUP_BEFORE_CHANGES=true       # Always backup before making changes

# =============================================================================
# OPERATIONAL SETTINGS
# =============================================================================

# Execution Mode
# ---------------------------------------------------------------------------
DEFAULT_MODE="interactive"       # Default mode (fresh-install|interactive|dry-run)
AUTO_REBOOT=false                # Automatically reboot after installation
REBOOT_DELAY_SECONDS=5           # Seconds to wait before automatic reboot

# Error Handling
# ---------------------------------------------------------------------------
ERROR_LOG_DIR="/var/log"         # Error log directory
ERROR_LOG_FILE="server-baseline-install.log"  # Error log filename
ERROR_LOG_RETENTION_DAYS=90      # Keep error logs for X days

# State Management
# ---------------------------------------------------------------------------
STATE_DIR="/var/lib/server-setup"       # State file directory
STATE_FILE="installation.state"         # State file name
ALLOW_RESUME=true                       # Allow resuming interrupted installation

# Verbosity
# ---------------------------------------------------------------------------
VERBOSE=false                    # Enable verbose output (debug mode)
SHOW_PROGRESS=true               # Show progress indicators

# =============================================================================
# ADVANCED CONFIGURATION
# =============================================================================

# Package Management
# ---------------------------------------------------------------------------
APT_INSTALL_RECOMMENDS=false     # Install recommended packages (false = minimal)
APT_AUTOREMOVE=true              # Auto-remove unused dependencies after cleanup

# Network Configuration
# ---------------------------------------------------------------------------
DISABLE_IPV6_SYSTEM=false        # Disable IPv6 system-wide (in addition to SSH)

# Timezone & Locale
# ---------------------------------------------------------------------------
AUTO_CONFIGURE_LOCALE=true       # Automatically configure locale (en_US.UTF-8)

# =============================================================================
# PROFILE METADATA
# =============================================================================

# Configuration Profile Information
# ---------------------------------------------------------------------------
CONFIG_PROFILE_NAME="default"
CONFIG_PROFILE_VERSION="1.0.0"
CONFIG_PROFILE_DESCRIPTION="Default balanced configuration for general-purpose servers"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# To create a custom configuration:
# 1. Copy this file to config/profiles/custom.conf
# 2. Modify the values you want to change
# 3. Run: ./install.sh --profile custom
#
# Or create a profile-specific config that sources this file:
#   source "$(dirname "${BASH_SOURCE[0]}")/../default.conf"
#   PASSWORD_MAX_DAYS=90  # Override just this value
#
# =============================================================================
