#!/bin/bash
# =============================================================================
# Ubuntu VPS Profile Configuration
# =============================================================================
# Production-grade settings for Ubuntu VPS servers
# Strict security, optimized for reliability
# =============================================================================

# Profile metadata
CONFIG_PROFILE_NAME="ubuntu-vps"
CONFIG_PROFILE_DESCRIPTION="Production Ubuntu VPS with strict security settings"

# =============================================================================
# PASSWORD & AUTHENTICATION
# =============================================================================
PASSWORD_MAX_DAYS=90             # Strict: 90 days password expiry
PASSWORD_MIN_DAYS=7
PASSWORD_WARN_DAYS=14
PASSWORD_MIN_LENGTH=12
PASSWORD_HASH_ROUNDS=65536

# =============================================================================
# SSH CONFIGURATION
# =============================================================================
SSH_NEW_PORT=888                 # Default SSH port
SSH_MAX_SESSIONS=2               # Strict: max 2 concurrent sessions
SSH_MAX_AUTH_TRIES=3
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=2
SSH_LOG_LEVEL="VERBOSE"

# =============================================================================
# FAIL2BAN
# =============================================================================
FAIL2BAN_SSH_BANTIME=7200        # 2 hours ban
FAIL2BAN_SSH_MAXRETRY=3          # 3 retries before ban
FAIL2BAN_SSH_FINDTIME=600

# =============================================================================
# SECURITY OPTIONS
# =============================================================================
DISABLE_USB_STORAGE=true         # USB storage disabled
ENABLE_LEGAL_BANNERS=true        # Legal banners enabled
PROC_HIDEPID=true                # Hide process info from other users
AIDE_ENABLED=true                # AIDE enabled for production

# =============================================================================
# MONITORING
# =============================================================================
RKHUNTER_ENABLED=true
LYNIS_ENABLED=true
SYSSTAT_ENABLED=true

# =============================================================================
# JOURNALD
# =============================================================================
JOURNAL_MAX_USE="500M"
JOURNAL_RETENTION_DAYS=30

# =============================================================================
# DOCKER
# =============================================================================
DOCKER_LOG_MAX_SIZE="10M"
DOCKER_LOG_MAX_FILES=3
