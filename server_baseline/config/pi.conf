#!/bin/bash
# =============================================================================
# Raspberry Pi Profile Configuration
# =============================================================================
# Lightweight settings optimized for ARM and SD cards
# Reduced I/O, longer intervals, SD card-friendly
# =============================================================================

# Profile metadata
CONFIG_PROFILE_NAME="raspberry-pi"
CONFIG_PROFILE_DESCRIPTION="Lightweight ARM settings for Raspberry Pi with SD card optimization"

# =============================================================================
# PASSWORD & AUTHENTICATION
# =============================================================================
PASSWORD_MAX_DAYS=365            # Relaxed: 365 days password expiry
PASSWORD_MIN_DAYS=7
PASSWORD_WARN_DAYS=30
PASSWORD_MIN_LENGTH=12
PASSWORD_HASH_ROUNDS=5000        # Lower rounds for ARM performance

# =============================================================================
# SSH CONFIGURATION
# =============================================================================
SSH_NEW_PORT=888                 # Default SSH port
SSH_MAX_SESSIONS=3               # More flexible: 3 concurrent sessions
SSH_MAX_AUTH_TRIES=3
SSH_CLIENT_ALIVE_INTERVAL=300
SSH_CLIENT_ALIVE_COUNT_MAX=2
SSH_LOG_LEVEL="INFO"             # Less verbose logging

# =============================================================================
# FAIL2BAN
# =============================================================================
FAIL2BAN_SSH_BANTIME=3600        # 1 hour ban (lighter)
FAIL2BAN_SSH_MAXRETRY=5          # 5 retries before ban
FAIL2BAN_SSH_FINDTIME=600

# =============================================================================
# SECURITY OPTIONS
# =============================================================================
DISABLE_USB_STORAGE=false        # USB storage enabled (ask user)
ENABLE_LEGAL_BANNERS=true        # Legal banners enabled
PROC_HIDEPID=true                # Hide process info from other users
AIDE_ENABLED=false               # AIDE disabled (too I/O intensive for SD)

# =============================================================================
# MONITORING
# =============================================================================
RKHUNTER_ENABLED=true
LYNIS_ENABLED=true
SYSSTAT_ENABLED=false            # Disabled to reduce SD card writes

# =============================================================================
# JOURNALD (SD card optimized)
# =============================================================================
JOURNAL_MAX_USE="100M"           # Smaller logs for SD card
JOURNAL_RETENTION_DAYS=14        # Shorter retention

# =============================================================================
# SWAP (SD card optimized)
# =============================================================================
SWAP_ENABLED=false               # Disable swap on SD cards
SYSCTL_VM_SWAPPINESS=1           # Minimal swapping if enabled

# =============================================================================
# DOCKER
# =============================================================================
DOCKER_LOG_MAX_SIZE="5M"         # Smaller logs
DOCKER_LOG_MAX_FILES=2           # Fewer rotations
