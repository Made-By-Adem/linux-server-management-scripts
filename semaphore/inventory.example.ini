# Example inventory for the Semaphore templates in this folder.
#
# Keep real inventories in Semaphore (or in inventory.ini next to this file,
# which git ignores), never in the repository.
#
# Use addresses the Semaphore container can actually reach. Semaphore usually
# runs in Docker; a container often cannot resolve VPN or MagicDNS names but
# can reach the VPN's IP addresses through its host.

[production]
# update-containers.yml: which containers per host (see README)
server1.example.com  update_containers_only="nginx,app-*"
server2.example.com  update_containers_all=true

[staging]
server3.example.com  ansible_host=192.0.2.10

[production:vars]
# Never update these, whatever the host selects. Under :vars Ansible reads
# values as plain strings, so use a comma-separated list here.
update_containers_exclude="db-*,*-worker"

[all:vars]
# install-script.sh moves SSH to port 888 and allows key-only root login.
ansible_user=root
ansible_port=888
ansible_pipelining=true
# accept-new: trust a host key the first time it is seen, refuse a changed one.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30'
