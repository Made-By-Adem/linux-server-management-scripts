---
# Semaphore template: update containers
#
# Runs update-containers/update-containers.sh --unattended: pulls a new image
# for every running compose container and recreates it. Every container is
# briefly down while it is recreated - that is a restart of the service.
#
# Uses the /usr/local/bin/update-containers symlink when the host has one,
# otherwise copies the script from this checkout to a temporary directory and
# runs it from there. The script needs nothing else from the repository.
#
# Extra vars:
#   dry_run        list what would be updated, change nothing (default false)
#   update_system  apt-get update + upgrade before the containers
#                  (default false, as in the script's unattended mode)
#   target         inventory group or host pattern (default all)
#   batch_size     hosts per batch (default 1)

- name: Update containers
  hosts: "{{ target | default('all') }}"
  serial: "{{ batch_size | default(1) }}"
  become: true
  gather_facts: false
  vars:
    dry_run: false
    update_system: false
  tasks:
    - name: Look for the update-containers command
      ansible.builtin.stat:
        path: /usr/local/bin/update-containers
        follow: true
      register: update_containers_cmd

    - name: Update the containers
      block:
        - name: Create a temporary directory for the script
          ansible.builtin.tempfile:
            state: directory
            suffix: update-containers
          register: update_containers_tmp
          when: not update_containers_cmd.stat.exists

        - name: Copy update-containers.sh to the host
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../update-containers/update-containers.sh"
            dest: "{{ update_containers_tmp.path }}/update-containers.sh"
            owner: root
            group: root
            mode: "0700"
          when: not update_containers_cmd.stat.exists

        - name: Run update-containers
          ansible.builtin.include_tasks: tasks/run-script.yml
          vars:
            run_argv: >-
              {{ [('/usr/local/bin/update-containers' if update_containers_cmd.stat.exists
                   else update_containers_tmp.path ~ '/update-containers.sh'),
                  '--unattended']
                 + (['--dry-run'] if dry_run | bool else [])
                 + (['--update-system'] if update_system | bool else []) }}
            run_changes: "{{ not dry_run | bool }}"
            run_timeout: 3600
      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ update_containers_tmp.path }}"
            state: absent
          when: update_containers_tmp.path is defined
